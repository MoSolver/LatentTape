<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latent Tape</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#060913;--panel:#0c1224;--line:#1a2342;--text:#e7ebff;--dim:#7f8bb5;--up:#3df2b0;--down:#ff4d7a;--r:14px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 85% -10%,#1b1245 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#082a3a 0%,transparent 55%),var(--ink);
  color:var(--text);font:400 14px/1.4 Sora,system-ui,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden}
header{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line)}
h1{font-size:19px;font-weight:700;letter-spacing:.02em}
header p{color:var(--dim);font-size:13px}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--down)}
.dot.on{background:var(--up);box-shadow:0 0 0 0 var(--up);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding:22px 28px;max-width:1700px;margin:auto}
aside{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pair{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:2px 10px;padding:12px 14px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;color:inherit;font:inherit;position:relative;overflow:hidden}
.pair:focus-visible{outline:2px solid #8b7bff}
.pair.sel{border-color:#5a4bd6;background:linear-gradient(120deg,#17154a,var(--panel))}
.pair b{font-weight:600}.pair .px{text-align:right;font-weight:600}
.pair canvas{grid-column:1/3;width:100%;height:34px;margin-top:6px}
.chg{font-size:12px;text-align:right}
.up{color:var(--up)}.down{color:var(--down)}
section{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}
.hero h2{font-size:15px;font-weight:400;color:var(--dim)}
.big{font-size:clamp(38px,5vw,64px);font-weight:700;letter-spacing:-.02em;line-height:1}
.stat{color:var(--dim);font-size:12px}.stat strong{display:block;font-size:18px;color:var(--text);font-weight:600}
.seg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;padding:7px 14px;cursor:pointer}
.seg button.on{background:#2a2470;color:var(--text)}
.row{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.card{background:linear-gradient(180deg,#0e1530,var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.card h3{font-size:12px;font-weight:400;color:var(--dim);margin-bottom:8px}
.card canvas{width:100%;display:block;border-radius:8px}
#price{height:260px}#book{height:260px}
.nets{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.nets .card h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nets canvas{height:auto;aspect-ratio:1/1;background:#060a18}
.nets canvas.tall{cursor:grab;touch-action:none}.nets canvas.tall:active{cursor:grabbing}
.empty{padding:80px 0;text-align:center;color:var(--dim)}
@media(max-width:1100px){.row{grid-template-columns:1fr}}
@media(max-width:1100px){.nets{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.nets{grid-template-columns:repeat(2,minmax(0,1fr))}header p{display:none}}
@media(prefers-reduced-motion:reduce){.dot.on{animation:none}}
</style>
</head>
<body>
<header>
  <h1>Latent Tape</h1><p>An autoencoder learns each Kraken order book as it moves</p>
  <div class="live"><span class="dot" id="dot"></span><span id="status">Connecting</span></div>
</header>
<main>
  <aside id="pairs"></aside>
  <section id="detail"><div class="empty">Waiting for the first order books from Kraken…</div></section>
  <div class="nets" id="nets"></div>
</main>
<script>
const D = 10;                                    // must match DEPTH in server.py
const SHAPES = {w1:[2*D,4*D], w2:[D,2*D], w3:[2*D,D], w4:[4*D,2*D]};  // [out, in]
const NETS = [['w1','Encoder layer 1'],['w2','Encoder layer 2'],['lat','Latent space'],['w3','Decoder layer 1'],['w4','Decoder layer 2']];
const UP='#3df2b0', DOWN='#ff4d7a';
const S = {};            // per-symbol state
let sel = null, detailBuilt = false, mode = 'flow';

// ---------- colour map: pink - ink - teal ----------
const STOPS = [[-1,[255,61,129]],[-.5,[122,31,162]],[0,[8,12,30]],[.5,[10,166,201]],[1,[159,252,240]]];
const LUT = Array.from({length:256},(_,i)=>{
  const v=i/127.5-1; let k=0; while(k<STOPS.length-2&&v>STOPS[k+1][0])k++;
  const [a,ca]=STOPS[k],[b,cb]=STOPS[k+1],t=Math.min(1,Math.max(0,(v-a)/(b-a)));
  return ca.map((c,j)=>Math.round(c+(cb[j]-c)*t));
});

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const fmt = p => p>=100?p.toFixed(2):p>=1?p.toFixed(4):p.toFixed(6);
const pct = x => (x>=0?'+':'')+(x*100).toFixed(3)+'%';
function fit(c){
  const d=devicePixelRatio||1,w=Math.round(c.clientWidth*d),h=Math.round(c.clientHeight*d);
  if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);return [g,c.clientWidth,c.clientHeight];
}
function lerp(a,b,k){for(let i=0;i<a.length;i++)a[i]+=(b[i]-a[i])*k;}

// ---------- drawing ----------
function heat(c,data,out,inn){
  const [g,W,H]=fit(c);
  const off=heat.off||(heat.off=document.createElement('canvas'));
  off.width=out;off.height=inn;
  const og=off.getContext('2d'),img=og.createImageData(out,inn);
  let m=1e-6;for(const v of data)m=Math.max(m,Math.abs(v));
  for(let o=0;o<out;o++)for(let i=0;i<inn;i++){
    const col=LUT[Math.round((data[o*inn+i]/m+1)*127.5)],p=(i*out+o)*4;
    img.data[p]=col[0];img.data[p+1]=col[1];img.data[p+2]=col[2];img.data[p+3]=255;
  }
  og.putImageData(img,0,0);
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  g.clearRect(0,0,W,H);g.drawImage(off,0,0,W,H);
}
function latentPlot(c,z,ell,rate){
  const [g,W,H]=fit(c),col=rate<0?DOWN:UP;
  g.clearRect(0,0,W,H);
  let lo=Infinity,hi=-Infinity;
  for(const v of z){lo=Math.min(lo,v);hi=Math.max(hi,v);}
  for(let i=1;i<ell.length;i+=2){lo=Math.min(lo,ell[i]);hi=Math.max(hi,ell[i]);}
  const pad=(hi-lo)*.12+1e-6;lo-=pad;hi+=pad;
  const X=x=>20+(x+1)/(z.length+1)*(W-40),Y=y=>H-14-(y-lo)/(hi-lo)*(H-28);
  g.strokeStyle='#141c38';g.lineWidth=1;
  for(let i=1;i<6;i++){g.beginPath();g.moveTo(0,H*i/6);g.lineTo(W,H*i/6);g.stroke();}
  g.beginPath();
  for(let i=0;i<ell.length;i+=2){const x=X(ell[i]),y=Y(ell[i+1]);i?g.lineTo(x,y):g.moveTo(x,y);}
  g.closePath();g.fillStyle=col+'22';g.fill();
  g.shadowColor=col;g.shadowBlur=14;g.strokeStyle=col;g.lineWidth=2;g.stroke();
  g.shadowBlur=0;g.strokeStyle='#ffffff30';g.lineWidth=1;g.beginPath();
  z.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
  z.forEach((v,i)=>{
    g.shadowColor='#ffa94d';g.shadowBlur=12;g.fillStyle='#ff9f1c';g.beginPath();g.arc(X(i),Y(v),5.5,0,7);g.fill();
    g.shadowBlur=0;g.fillStyle='#ffe66d';g.beginPath();g.arc(X(i),Y(v),2.3,0,7);g.fill();
  });
}
function line(c,arr,col,opt={}){
  const [g,W,H]=fit(c);g.clearRect(0,0,W,H);
  if(arr.length<2)return;
  let lo=Math.min(...arr),hi=Math.max(...arr);if(hi-lo<1e-12){hi+=1e-9;lo-=1e-9;}
  const padL=opt.axis?0:2,padR=opt.axis?64:2,pad=opt.axis?12:3;
  const X=i=>padL+i/(arr.length-1)*(W-padL-padR),Y=v=>H-pad-(v-lo)/(hi-lo)*(H-2*pad);
  const path=()=>{g.beginPath();arr.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));};
  if(opt.axis){g.strokeStyle='#141c38';for(let i=0;i<5;i++){g.beginPath();g.moveTo(0,pad+i*(H-2*pad)/4);g.lineTo(W-padR,pad+i*(H-2*pad)/4);g.stroke();}
    g.fillStyle='#7f8bb5';g.font='11px Sora,sans-serif';g.textAlign='left';
    g.fillText(fmt(hi),W-padR+8,pad+4);g.fillText(fmt(lo),W-padR+8,H-pad+4);}
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,col+'55');gr.addColorStop(1,col+'00');
  path();g.lineTo(X(arr.length-1),H);g.lineTo(X(0),H);g.closePath();g.fillStyle=gr;g.fill();
  path();g.strokeStyle=col;g.lineWidth=opt.axis?2:1.5;g.shadowColor=col;g.shadowBlur=opt.axis?10:0;g.stroke();g.shadowBlur=0;
  const lx=X(arr.length-1),ly=Y(arr[arr.length-1]);
  g.fillStyle=col;g.beginPath();g.arc(lx,ly,opt.axis?4:2.5,0,7);g.fill();
}
function book(c,s){
  const [g,W,H]=fit(c);g.clearRect(0,0,W,H);
  const t=s.cur,rowH=H/D,mid=W/2;
  const mx=Math.max(...t.vb,...t.va,1e-6);
  g.font='10.5px Sora,sans-serif';g.textBaseline='middle';
  for(let i=0;i<D;i++){
    const y=i*rowH+rowH/2,lb=t.vb[i]/mx*(mid-60),la=t.va[i]/mx*(mid-60);
    const gb=g.createLinearGradient(mid,0,mid-lb,0);gb.addColorStop(0,UP+'cc');gb.addColorStop(1,UP+'22');
    const ga=g.createLinearGradient(mid,0,mid+la,0);ga.addColorStop(0,DOWN+'cc');ga.addColorStop(1,DOWN+'22');
    g.fillStyle=gb;g.fillRect(mid-lb-3,y-rowH*.34,lb,rowH*.68);
    g.fillStyle=ga;g.fillRect(mid+3,y-rowH*.34,la,rowH*.68);
    g.fillStyle='#9aa6d4';g.textAlign='left';g.fillText((t.nb[i]*1e4).toFixed(1)+' bp',6,y);
    g.textAlign='right';g.fillText('+'+(t.na[i]*1e4).toFixed(1)+' bp',W-6,y);
  }
}


// ---------- 3D surface (three.js) ----------
const surf = {};
function makeSurface(canvas,out,inn){
  const R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  R.setPixelRatio(Math.min(devicePixelRatio||1,2));
  const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,20);
  cam.position.set(0,1.25,2.2);cam.lookAt(0,-.05,0);
  scene.add(new THREE.AmbientLight(0xffffff,.75));
  const sun=new THREE.DirectionalLight(0xffffff,1.0);sun.position.set(1.5,2.5,1.2);scene.add(sun);
  const rim=new THREE.DirectionalLight(0x7a6bff,.6);rim.position.set(-2,1,-1.5);scene.add(rim);
  const grp=new THREE.Group();scene.add(grp);
  const n=out*inn,pos=new Float32Array(n*3),col=new Float32Array(n*3),idx=[];
  for(let j=0;j<inn;j++)for(let i=0;i<out;i++){
    const k=j*out+i;pos[k*3]=(i/(out-1)-.5)*1.5;pos[k*3+2]=(j/(inn-1)-.5)*1.5;
    if(i<out-1&&j<inn-1){const a=k,b=k+1,c=k+out,d=c+1;idx.push(a,c,b,b,c,d);}
  }
  const geom=new THREE.BufferGeometry();
  geom.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geom.setAttribute('color',new THREE.BufferAttribute(col,3));
  geom.setIndex(idx);
  grp.add(new THREE.Mesh(geom,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.5,metalness:.15,side:THREE.DoubleSide})));
  grp.add(new THREE.Mesh(geom,new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.08})));
  const grid=new THREE.GridHelper(1.5,10,0x2a3566,0x151d3d);grid.position.y=-.5;grp.add(grid);
  grp.rotation.set(0,-.6,0);
  let drag=false,px=0,py=0,w0=0,h0=0;
  canvas.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointerup',()=>drag=false);
  canvas.addEventListener('pointermove',e=>{if(!drag)return;
    grp.rotation.y+=(e.clientX-px)*.008;grp.rotation.x=Math.max(-.6,Math.min(.9,grp.rotation.x+(e.clientY-py)*.005));px=e.clientX;py=e.clientY;});
  return {
    draw(data){
      const W=canvas.clientWidth,H=canvas.clientHeight;
      if(W!==w0||H!==h0){w0=W;h0=H;R.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();}
      let m=1e-6;for(const v of data)m=Math.max(m,Math.abs(v));
      for(let j=0;j<inn;j++)for(let i=0;i<out;i++){
        const k=j*out+i,v=data[i*inn+j]/m,c=LUT[Math.round((v+1)*127.5)];
        pos[k*3+1]=v*.42;col[k*3]=(c[0]*.8+34)/255;col[k*3+1]=(c[1]*.8+34)/255;col[k*3+2]=(c[2]*.8+44)/255;
      }
      geom.attributes.position.needsUpdate=true;geom.attributes.color.needsUpdate=true;geom.computeVertexNormals();
      if(!drag)grp.rotation.y+=.003;
      R.render(scene,cam);
    },
    dispose(){geom.dispose();R.dispose();R.forceContextLoss();}
  };
}

// ---------- UI ----------
function buildSidebar(){
  $('pairs').innerHTML='';
  for(const sym of Object.keys(S)){
    const b=document.createElement('button');b.className='pair';b.id='p-'+sym.replace('/','');
    b.innerHTML=`<b>${sym}</b><span class="px"></span><span class="stat">1 min tape</span><span class="chg"></span><canvas></canvas>`;
    b.onclick=()=>select(sym);$('pairs').appendChild(b);
  }
}
function buildDetail(){
  $('detail').innerHTML=`
  <div class="hero"><div><h2 id="name"></h2><div class="big" id="bigpx"></div></div>
    <div class="stat">Move over window<strong id="rate"></strong></div>
    <div class="stat">Reconstruction loss<strong id="loss"></strong></div>
    <div class="seg" role="group" aria-label="Layer view"><button data-m="flow">Live signal</button><button data-m="w">Raw weights</button></div></div>
  <div class="row"><div class="card"><h3>Mid price</h3><canvas id="price"></canvas></div>
    <div class="card"><h3>Order book, ten levels each side</h3><canvas id="book"></canvas></div></div>
  `;
  $('nets').innerHTML=`${NETS.map(([k,t])=>`<div class="card"><h3>${t}</h3><canvas id="n-${k}" class="${k==='lat'?'':'tall'}"></canvas></div>`).join('')}`;
  for(const k in surf){surf[k].dispose();delete surf[k];}
  if(window.THREE)for(const k of ['w1','w2','w3','w4'])surf[k]=makeSurface($('n-'+k),...SHAPES[k]);
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;});
  detailBuilt=true;
}
function select(sym){
  sel=sym;detailBuilt=false;
  document.querySelectorAll('.pair').forEach(e=>e.classList.toggle('sel',e.id==='p-'+sym.replace('/','')));
}
function ingest(msg){
  const first=!Object.keys(S).length;
  for(const [sym,d] of Object.entries(msg.pairs)){
    const s=S[sym]||(S[sym]={price:[],loss:[],cur:null});
    s.tgt={w1:d.w1,w2:d.w2,w3:d.w3,w4:d.w4,s1:d.s1,s2:d.s2,s3:d.s3,s4:d.s4,z:d.latent,ell:d.ellipse,nb:d.nb,na:d.na,vb:d.vb,va:d.va};
    if(!s.cur){s.cur={};for(const k in s.tgt)s.cur[k]=Float32Array.from(s.tgt[k]);}
    s.mid=d.mid;s.rate=d.rate;s.lossNow=d.loss;
    s.price.push(d.mid);s.loss.push(d.loss);
    if(s.price.length>300){s.price.shift();s.loss.shift();}
  }
  if(first){buildSidebar();select(Object.keys(S)[0]);}
  for(const [sym,s] of Object.entries(S)){
    const el=$('p-'+sym.replace('/',''));if(!el||s.mid===undefined)continue;
    el.querySelector('.px').textContent=fmt(s.mid);
    const ch=el.querySelector('.chg');ch.textContent=pct(s.rate);ch.className='chg '+(s.rate<0?'down':'up');
    line(el.querySelector('canvas'),s.price.slice(-120),s.rate<0?DOWN:UP);
  }
}
function frame(){
  const s=S[sel];
  if(s){
    if(!detailBuilt)buildDetail();
    for(const k in s.cur)lerp(s.cur[k],s.tgt[k],.22);
    const col=s.rate<0?DOWN:UP;
    $('name').textContent=sel;$('bigpx').textContent=fmt(s.mid);
    const r=$('rate');r.textContent=pct(s.rate);r.className=s.rate<0?'down':'up';
    $('loss').textContent=s.lossNow.toExponential(2);
    line($('price'),s.price,col,{axis:true});book($('book'),s);
    for(const k of ['w1','w2','w3','w4']){const dat=s.cur[mode==='flow'?'s'+k[1]:k];
      if(surf[k])surf[k].draw(dat);else heat($('n-'+k),dat,...SHAPES[k]);}
    document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
    latentPlot($('n-lat'),s.cur.z,s.cur.ell,s.rate);
  }
  requestAnimationFrame(frame);
}

// ---------- socket ----------
function connect(){
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>{$('dot').classList.add('on');$('status').textContent='Live from Kraken';};
  ws.onmessage=e=>ingest(JSON.parse(e.data));
  ws.onclose=()=>{$('dot').classList.remove('on');$('status').textContent='Reconnecting';setTimeout(connect,2000);};
}
connect();requestAnimationFrame(frame);
</script>
</body>
</html>
